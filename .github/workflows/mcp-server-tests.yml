name: MCP Server Tests

# Live end-to-end tests for the Graphiti MCP server against FalkorDB (the default
# database) and a real OpenAI model. Runs on PRs and pushes to main that touch the
# MCP server. The `ci` environment labels this as CI rather than an application
# deployment. Cross-repository and Dependabot PRs receive no secrets, so the suite
# skips itself there when OPENAI_API_KEY is unset. The base repository is itself an
# upstream fork, so GitHub's `repo.fork` flag cannot identify secretless PRs.
on:
  push:
    branches: [main]
    paths:
      - "mcp_server/**"
      - "graphiti_core/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mcp-server-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp_server/**"
      - "graphiti_core/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mcp-server-tests.yml"

permissions:
  contents: read

# Cancel superseded runs on the same ref so repeated pushes don't keep paying for
# real OpenAI calls.
concurrency:
  group: mcp-server-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-mcp-tests:
    runs-on: ubuntu-latest
    environment: ci
    # Insurance against a hung stdio subprocess / uv sync.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Socket Firewall wrapper
        uses: ./.github/actions/setup-socket-firewall
        with:
          socket-api-key: ${{ secrets.SOCKET_API_KEY }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "latest"
      - name: Start FalkorDB
        # Run the database on the host network so readiness checks and tests use the
        # same endpoint across runner implementations. Readiness uses `docker exec`.
        run: docker run -d --name falkordb --network host falkordb/falkordb:latest
      - name: Install dependencies
        working-directory: mcp_server
        run: uv sync
      - name: Run MCP configuration and security unit tests
        working-directory: mcp_server
        run: |
          uv run pytest \
            tests/test_neptune_config.py \
            tests/test_core_parity.py \
            tests/test_mcp_security.py \
            -m "not integration"
      - name: Type-check MCP security and routing surfaces
        working-directory: mcp_server
        run: >-
          uv run pyright
          src/security.py
          src/services/graphiti_scope.py
          src/services/queue_service.py
          src/graphiti_mcp_server.py
          tests/test_core_parity.py
          tests/test_mcp_security.py
      - name: Wait for FalkorDB
        run: |
          for i in $(seq 1 30); do
            if docker exec falkordb redis-cli ping 2>/dev/null | grep -q PONG; then
              echo "falkordb ready after ${i}s"; break
            fi
            if [ "$i" -eq 30 ]; then echo "falkordb did not become ready in 30s" >&2; docker logs falkordb; exit 1; fi
            sleep 1
          done
      - name: Run live MCP integration tests
        working-directory: mcp_server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IS_SECRETLESS_PULL_REQUEST: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]') }}
          FALKORDB_URI: redis://localhost:6379
          # gpt-5.5 is the server's runtime default, but it requires a key/account
          # with fast gpt-5.5 access; CI pins a lighter, broadly-available model so
          # the live test stays fast and reliable. It exercises the same pipeline.
          MODEL_NAME: gpt-4.1-mini
          # Raise episode/LLM-call concurrency so the live episode processes quickly.
          SEMAPHORE_LIMIT: "20"
        # pytest exits 5 when the module self-skips because OPENAI_API_KEY is not
        # available. That is expected for cross-repository and Dependabot PRs, and
        # can also happen when the ci environment has no live-test key configured.
        # When a key is present, exit 5 is unexpected and must fail: FalkorDB may
        # have become unreachable or the integration selection may be broken. Real
        # failures (exit 1), import errors (exit 2), and usage errors (exit 4) also
        # remain failures.
        run: |
          set +e
          uv run pytest tests/test_live_falkordb_int.py -m integration -p no:cacheprovider
          code=$?
          if [ "$code" -eq 5 ]; then
            if [ -z "$OPENAI_API_KEY" ]; then
              if [ "$IS_SECRETLESS_PULL_REQUEST" = "true" ]; then
                echo 'No live tests ran (secretless PR self-skip); treating as success.'
              else
                echo 'No live tests ran (OPENAI_API_KEY is not configured or available); treating as success.'
              fi
              exit 0
            fi
            echo 'No live MCP tests ran even though OPENAI_API_KEY is set. FalkorDB became unreachable or integration selection broke. Failing.' >&2
            exit 1
          fi
          exit "$code"
